[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blockblast-ai"
version = "1.0.0"
description = "Autonomous Block Blast Mobile Gameplay, Touch Calibration & NEAT Neuroevolution Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Marcos Binder" }
]
keywords = [
    "blockblast",
    "neat",
    "neuroevolution",
    "computer-vision",
    "opencv",
    "adb",
    "mobile-gaming",
    "reinforcement-learning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "neat-python>=0.92",
    "pygame-ce>=2.5.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/marcosbinder/blockblast-ai"
Repository = "https://github.com/marcosbinder/blockblast-ai"
Issues = "https://github.com/marcosbinder/blockblast-ai/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
